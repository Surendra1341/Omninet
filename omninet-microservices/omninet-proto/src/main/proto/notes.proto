syntax = "proto3";

package org.zemo.omninet.proto;

option java_multiple_files = true;
option java_package = "org.zemo.omninet.proto.notes";
option java_outer_classname = "NotesProto";

// Notes query service — allows other services (e.g. AI) to fetch user notes for context
service NotesQueryService {

  // Retrieve notes for a user (used by AI service for context-aware responses)
  rpc GetUserNotes (GetUserNotesRequest) returns (GetUserNotesResponse);

  // Get a single note by ID
  rpc GetNoteById (GetNoteByIdRequest) returns (NoteDetail);
}

// ─── Request / Response Messages ────────────────────────────────────────────

message GetUserNotesRequest {
  string user_email = 1;
  int32 page = 2;
  int32 size = 3;
  string search_keyword = 4;  // Optional search filter
}

message GetUserNotesResponse {
  repeated NoteDetail notes = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_count = 4;
  bool has_next = 5;
}

message GetNoteByIdRequest {
  int32 note_id = 1;
  string user_email = 2;     // For ownership verification
}

message NoteDetail {
  int32 id = 1;
  string title = 2;
  string description = 3;
  string category_name = 4;
  int32 category_id = 5;
  bool has_attachment = 6;
  string created_by = 7;
  int64 created_at_epoch_ms = 8;
  int64 updated_at_epoch_ms = 9;
}
